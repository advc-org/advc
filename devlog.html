<!-- marked 18.1.3, pinned by exact version + subresource integrity.
     crossorigin="anonymous" is required: a cross-origin resource with an
     integrity attribute must be fetched in CORS mode (unpkg answers
     Access-Control-Allow-Origin: *).
     TWO digests: unpkg's brotli precompress serves stale bytes to browsers
     (Accept-Encoding: br) — the second digest is what the browser computed
     for those, from its own console error. The browser accepts either.
     If both miss (a future re-precompress), the page falls back to its own
     mini renderer over the embedded markdown: never raw, never blank. -->
<script src="https://unpkg.com/marked@18.1.3/lib/marked.umd.js"
        integrity="sha384-b69fecc988602be15e555af3d923e680a5f96ad559f0ff2145e02f38f527e7c336eb954dcb521b76664063b266774805 sha384-tp/syYhgK+FeVVrz2SPmgKX5atVZ8P8hReAvOPUn58M265VNy1IbdmZAY7Jmd0gF"
        crossorigin="anonymous" defer></script>
<script>
window.addEventListener("DOMContentLoaded", () => {
    // A minimal fallback renderer: if the CDN'smarked never loads (offline,
    // integrity mismatch beyond both pinned digests), the devlog still
    // renders its structure — headings, lists, code, bold — never raw.
    const mini = (md) => md
        .split(/\n\n+/)
        .map((block) => {
            const esc = block.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            if (/^#\s/.test(esc)) return `<h1>${esc.slice(2)}</h1>`;
            if (/^##\s/.test(esc)) return `<h2>${esc.slice(3)}</h2>`;
            if (/^###\s/.test(esc)) return `<h3>${esc.slice(4)}</h3>`;
            if (/^[-*]\s/m.test(esc)) {
                return `<ul>${esc.split(/\n/).filter((l) => /^[-*]\s/.test(l))
                    .map((l) => `<li>${l.replace(/^[-*]\s/, "")}</li>`).join("")}</ul>`;
            }
            const inline = esc
                .replace(/`([^`]+)`/g, "<code>$1</code>")
                .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
            return `<p>${inline.replace(/\n/g, "<br>")}</p>`;
        })
        .join("");

    // render(): removes the loading screen, styles the article, and writes
    // the markdown — the loader is gone the moment the content exists.
    const render = (md) => {
        const box = document.querySelector("[data-devlog]");
        box.classList.remove("loading");
        box.classList.add("rendered");
        box.innerHTML = window.marked ? marked.parse(md) : mini(md);
    };
    const fail = (why) => {
        const box = document.querySelector("[data-devlog]");
        box.classList.remove("loading");
        box.classList.add("rendered");
        box.innerHTML = `<p class="devlog-loading">${why}</p>`;
    };

    // Source 1: the devlog.md next to the page (the freshest, over http).
    fetch("devlog.md", { cache: "no-store" })
        .then((r) => {
            if (!r.ok) throw new Error(`http ${r.status}`);
            return r.text();
        })
        .then(render)
        .catch(() => {
            // Source 2: the embedded copy — publish-repo base64-encodes
            // devlog.md into this page, so it renders even from disk with no
            // server, and even if marked never loads from the CDN.
            const holder = document.querySelector("[data-devlog-md]");
            let md = "";
            if (holder) {
                md = holder.dataset.enc === "base64"
                    ? atob(holder.textContent.replace(/\s+/g, ""))
                    : "";
            }
            if (md.trim()) {
                render(md);
            } else {
                fail("the devlog could not be loaded — embed it (just publish-repo) or serve this folder over http.");
            }
        });
});
</script>
